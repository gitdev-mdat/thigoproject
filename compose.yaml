services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: thigo
      POSTGRES_USER: thigo
      POSTGRES_PASSWORD: thigo
    ports:
      - "5432:5432"
    volumes:
      - thigo-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thigo -d thigo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thigo-postgres-data:
