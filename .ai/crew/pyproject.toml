[project]
name = "thigo-ai-crew"
version = "0.1.0"
description = "Isolated CrewAI development workflows for THIGO"
requires-python = ">=3.13,<3.14"
dependencies = [
  "crewai==1.15.23",
  "python-dotenv>=1.1,<2"
]

[project.scripts]
run_crew = "thigo_ai.main:run"
thigo-ai-doctor = "thigo_ai.doctor:main"
thigo-ai-smoke = "thigo_ai.smoke:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.14,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thigo_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
